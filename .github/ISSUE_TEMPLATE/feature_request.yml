name: Feature request
description: Suggest an idea for Shadow Gym
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What problem does it solve or what would it make better?
